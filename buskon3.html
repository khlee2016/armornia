<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>(숲) 작은 음악회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --color-bg: #ffffff;
    --color-bg-secondary: #f5f5f3;
    --color-text-primary: #1a1a18;
    --color-text-secondary: #6b6b66;
    --color-text-tertiary: #9e9e97;
    --color-border: rgba(0,0,0,0.12);
    --color-border-hover: rgba(0,0,0,0.22);
    --radius-md: 8px;
    --radius-lg: 12px;
    --accent: #E85D26;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #1a1a18;
      --color-bg-secondary: #242422;
      --color-text-primary: #f0efe8;
      --color-text-secondary: #9e9e97;
      --color-text-tertiary: #6b6b66;
      --color-border: rgba(255,255,255,0.1);
      --color-border-hover: rgba(255,255,255,0.2);
    }
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--color-bg);
    color: var(--color-text-primary);
    min-height: 100vh;
  }

  .wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  .site-header {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    margin-bottom: 2.5rem;
    border-bottom: 0.5px solid var(--color-border);
    padding-bottom: 1.2rem;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    letter-spacing: 3px;
    color: var(--color-text-primary);
    line-height: 1;
  }

  .logo span { color: #E85D26; }

  .tagline {
    font-size: 12px;
    color: var(--color-text-tertiary);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding-bottom: 8px;
  }

  .day-section { margin-bottom: 2.5rem; }

  .day-label {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1rem;
  }

  .day-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: #E85D26;
    background: rgba(232,93,38,0.08);
    padding: 4px 10px;
    border-radius: 4px;
    border: 0.5px solid rgba(232,93,38,0.28);
  }

  .day-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--color-text-primary);
  }

  .day-divider {
    flex: 1;
    height: 0.5px;
    background: var(--color-border);
  }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  @media (max-width: 560px) {
    .video-grid { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 360px) {
    .video-grid { grid-template-columns: 1fr; }
  }

  .video-card {
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 0.5px solid var(--color-border);
    background: var(--color-bg);
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.18s ease;
    position: relative;
  }

  .video-card:hover {
    transform: translateY(-4px);
    border-color: var(--color-border-hover);
  }

  .video-card:hover .play-btn {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    position: relative;
    overflow: hidden;
  }

  .thumb-bg {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
  }

  .play-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    width: 40px;
    height: 40px;
    background: rgba(0,0,0,0.7);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: all 0.18s ease;
  }

  .play-btn i { font-size: 18px; color: #fff; margin-left: 2px; }

  .duration-badge {
    position: absolute;
    bottom: 6px;
    right: 7px;
    background: rgba(0,0,0,0.72);
    color: #fff;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 6px;
    border-radius: 3px;
  }

  .card-info { padding: 9px 11px 11px; }

  .card-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--color-text-primary);
    line-height: 1.4;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-artist {
    font-size: 11px;
    color: var(--color-text-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .card-artist i { font-size: 12px; }

  .card-views {
    font-size: 10px;
    color: var(--color-text-tertiary);
    display: flex;
    align-items: center;
    gap: 3px;
  }

  .card-views i { font-size: 11px; }

  .genre-tag {
    display: inline-block;
    font-size: 9px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 3px;
    margin-bottom: 5px;
    font-weight: 500;
  }

  .tag-jazz   { background: #E6F1FB; color: #185FA5; }
  .tag-indie  { background: #EAF3DE; color: #3B6D11; }
  .tag-rnb    { background: #FBEAF0; color: #993556; }
  .tag-folk   { background: #FAEEDA; color: #854F0B; }
  .tag-hiphop { background: #EEEDFE; color: #534AB7; }
  .tag-pop    { background: #FAECE7; color: #993C1D; }

  /* Modal */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.84);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  .modal-backdrop.open { display: flex; }

  .modal {
    width: 90%;
    max-width: 580px;
    background: var(--color-bg);
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 0.5px solid var(--color-border);
    position: relative;
  }

  .modal-video {
    width: 100%;
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 72px;
    position: relative;
  }

  .modal-video .overlay-icon {
    position: absolute;
    font-size: 60px;
    opacity: 0.18;
    color: #000;
  }

  .close-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(0,0,0,0.65);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 17px;
    z-index: 10;
    transition: background 0.15s;
  }

  .close-btn:hover { background: rgba(0,0,0,0.85); }

  .modal-body { padding: 16px 18px 18px; }

  .modal-title {
    font-size: 17px;
    font-weight: 500;
    color: var(--color-text-primary);
    margin-bottom: 5px;
  }

  .modal-sub {
    font-size: 13px;
    color: var(--color-text-secondary);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .modal-sub i { font-size: 14px; }

  .modal-actions { display: flex; gap: 8px; }

  .modal-actions button {
    flex: 1;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 8px 0;
    border-radius: var(--radius-md);
    border: 0.5px solid var(--color-border-hover);
    background: transparent;
    color: var(--color-text-primary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    transition: background 0.15s;
  }

  .modal-actions button:hover { background: var(--color-bg-secondary); }
  .modal-actions button i { font-size: 15px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="site-header">
    <div class="logo">숲<span>.</span>작은 음악회</div>
    <div class="tagline">(숲) 작은 음악회</div>
  </div>
  <div id="days-container"></div>
</div>

<div class="modal-backdrop" id="modal" onclick="closeModalOutside(event)">
  <div class="modal" id="modal-inner">
    <div class="modal-video" id="modal-thumb-bg">
      <span id="modal-emoji"></span>
      <i class="ti ti-player-play overlay-icon" aria-hidden="true"></i>
      <button class="close-btn" onclick="document.getElementById('modal').classList.remove('open')" aria-label="닫기">
        <i class="ti ti-x"></i>
      </button>
    </div>
    <div class="modal-body">
      <div id="modal-genre-tag"></div>
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-sub">
        <i class="ti ti-user" aria-hidden="true"></i>
        <span id="modal-artist"></span>
        <i class="ti ti-map-pin" aria-hidden="true"></i>
        <span id="modal-location"></span>
        <i class="ti ti-clock" aria-hidden="true"></i>
        <span id="modal-duration"></span>
      </div>
      <div class="modal-actions">
        <button id="modal-yt-btn" onclick="window.open(currentUrl,'_blank')" style="background:#FF0000;color:#fff;border-color:#FF0000;"><i class="ti ti-brand-youtube" aria-hidden="true"></i> YouTube에서 보기</button>
        <button><i class="ti ti-share" aria-hidden="true"></i> 공유하기</button>
        <button><i class="ti ti-bookmark" aria-hidden="true"></i> 저장</button>
      </div>
    </div>
  </div>
</div>

<script>
const YT = ["https://youtu.be/Nud43pyEQHs",
            "https://youtu.be/rbyQA4jq7RU",
            "https://youtu.be/2mxp_6Gw_ts",
            
            "https://youtu.be/lqPEC-GOTmM",
            "https://youtu.be/AWtpGgGyKiQ",
            "https://youtu.be/Z83lOisqOKc",
            
            "https://youtu.be/xAevnIpubpg",
            "https://youtu.be/gzJd_HRU1Hw",
            "https://youtu.be/T3ceqRCZTqQ",
            
            "https://youtu.be/OtE0BF11O7U",
            "https://youtu.be/auIINxX-y1E",
            "https://youtu.be/a05mkqxUF0I",
           ];;

const days = [
  {
    label: "DAY 01",
    title: "2026년 5월 18일 · 월요일",
    videos: [
      { emoji: "STPB", bg: "#E6F1FB", title: "1일차 (1)", artist: "조현우", location: "과기대 테크노 숲", duration: "8:24", views: "12.4만", genre: "jazz", tag: "tag-jazz", url: YT[0] },
      { emoji: "Armonia", bg: "#EAF3DE", title: "1일차 (2)", artist: "신일훈", location: "과기대 테크노 숲", duration: "5:47", views: "6.8만", genre: "indie", tag: "tag-indie", url: YT[1] },
      { emoji: "Armonia", bg: "#FBEAF0", title: "1일차 (3)", artist: "김소연", location: "과기대 테크노 숲", duration: "11:02", views: "18.1만", genre: "r&b", tag: "tag-rnb", url: YT[2] }
    ]
  },
  {
    label: "DAY 02",
    title: "2026년 5월 19일 · 화요일",
    videos: [
      { emoji: "STPB", bg: "#FAEEDA", title: "2일차 (1)", artist: "박구만", location: "과기대 테크노 숲", duration: "6:55", views: "4.2만", genre: "folk", tag: "tag-folk", url: YT[3] },
      { emoji: "Armonia", bg: "#EEEDFE", title: "2일차 (2)", artist: "이길흥", location: "과기대 테크노 숲", duration: "9:18", views: "31.7만", genre: "hiphop", tag: "tag-hiphop", url: YT[4] },
      { emoji: "Armonia", bg: "#FAECE7", title: "2일차 (3)", artist: "임원식", location: "과기대 테크노 숲", duration: "13:40", views: "9.5만", genre: "pop", tag: "tag-pop", url: YT[5] }
    ]
  },
  {
    label: "DAY 01 (2nd)",
    title: "2026년 5월 18일 · 월요일",
    videos: [
      { emoji: "STPB", bg: "#E8F8F2", title: "1일차 (1)", artist: "전중열", location: "과기대 테크노 숲", duration: "7:11", views: "22.0만", genre: "percussion", tag: "tag-jazz", url: YT[6] },
      { emoji: "Armonia", bg: "#FDF3FB", title: "1일차 (2)", artist: "홍형기", location: "과기대 테크노 숲", duration: "9:33", views: "8.3만", genre: "classic", tag: "tag-indie", url: YT[7] },
      { emoji: "Armonia", bg: "#FFF5E6", title: "1일차 (3)", artist: "송화창", location: "과기대 테크노 숲", duration: "6:48", views: "5.1만", genre: "jazz", tag: "tag-folk", url: YT[8] }
    ]
  },
  {
    label: "DAY 02 (2nd)",
    title: "2026년 5월 19일 · 화요일",
    videos: [
      { emoji: "STPB", bg: "#EEF6FF", title: "2일차 (1)", artist: "장성용", location: "과기대 테크노 숲", duration: "10:05", views: "14.7만", genre: "blues", tag: "tag-hiphop", url: YT[9] },
      { emoji: "Armonia", bg: "#F0FBE8", title: "2일차 (2)", artist: "김연태", location: "과기대 테크노 숲", duration: "12:22", views: "27.6만", genre: "band", tag: "tag-rnb", url: YT[10] },
      { emoji: "Armonia", bg: "#FCF0F8", title: "2일차 (3)", artist: "김광호", location: "과기대 테크노 숲", duration: "8:57", views: "9.9만", genre: "latin", tag: "tag-pop", url: YT[11] }
    ]
  }
];

const container = document.getElementById('days-container');

days.forEach((day, di) => {
  const sec = document.createElement('div');
  sec.className = 'day-section';
  sec.innerHTML = `
    <div class="day-label">
      <span class="day-num">${day.label}</span>
      <span class="day-title">${day.title}</span>
      <div class="day-divider"></div>
    </div>
    <div class="video-grid">
      ${day.videos.map((v, vi) => `
        <div class="video-card" onclick="openModal(${di},${vi})" tabindex="0" role="button" aria-label="${v.title} 재생" style="cursor:pointer;">
          <div class="thumb">
            <div class="thumb-bg" style="background:${v.bg};">${v.emoji}</div>
            <div class="play-btn" aria-hidden="true"><i class="ti ti-player-play"></i></div>
            <span class="duration-badge">${v.duration}</span>
          </div>
          <div class="card-info">
            <span class="genre-tag ${v.tag}">${v.genre}</span>
            <div class="card-title">${v.title}</div>
            <div class="card-meta">
              <div class="card-artist"><i class="ti ti-user" aria-hidden="true"></i>${v.artist}</div>
              <div class="card-views"><i class="ti ti-eye" aria-hidden="true"></i>${v.views}</div>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `;
  container.appendChild(sec);
});

let currentUrl = "";

function openModal(di, vi) {
  const v = days[di].videos[vi];
  currentUrl = v.url;
  document.getElementById('modal-emoji').textContent = v.emoji;
  document.getElementById('modal-thumb-bg').style.background = v.bg;
  document.getElementById('modal-genre-tag').innerHTML = `<span class="genre-tag ${v.tag}" style="margin-bottom:8px;display:inline-block;">${v.genre}</span>`;
  document.getElementById('modal-title').textContent = v.title;
  document.getElementById('modal-artist').textContent = v.artist;
  document.getElementById('modal-location').textContent = v.location;
  document.getElementById('modal-duration').textContent = v.duration;
  document.getElementById('modal').classList.add('open');
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.getElementById('modal').classList.remove('open');
});
</script>
</body>
</html>
